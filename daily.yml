name: Update BOX reference prices
on:
  schedule:
    - cron: '17 0 * * *' # 09:17 JST, approximate; scheduled jobs can be delayed
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update price records
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_SELLER_ACCOUNTS: ${{ vars.X_SELLER_ACCOUNTS }}
          AUTHORIZED_PRICE_CSV_URL: ${{ secrets.AUTHORIZED_PRICE_CSV_URL }}
        run: python scripts/update.py
      - name: Commit data only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update price snapshots"
            git push
          fi
